# Rootless Podman deployment (Docker users: compose.docker.yaml).
#   podman compose up -d        start
#   podman compose logs -f      follow logs
#
# Before the first `up` (see guides/guide-deploy.txt):
#   mkdir -p data logs backups secrets && chmod 700 secrets
#   printf '%s' 'YOUR_BOT_TOKEN'   > secrets/discord_token
#   printf '%s' 'YOUR_WEBHOOK_URL' > secrets/discord_webhook_url   # or leave the file empty
#   chmod 600 secrets/*
#   podman unshare chown -R 10001:10001 data logs backups secrets   # the bot's own user, inside your user namespace
#
# Same hardening as compose.docker.yaml; see the notes there. The bot runs as
# its own user, tenman (10001). Under rootless Podman that id lives in your
# user namespace, so give it the folders with `podman unshare chown` (above);
# `ls -l` on the host then shows a high subordinate uid, which is expected.
services:
  bot:
    image: localhost/tenman-bot:latest
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"   # tenman, the bot's own unprivileged user (created in the image)
    env_file: .env
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      DISCORD_WEBHOOK_URL_FILE: /run/secrets/discord_webhook_url
      DB_PATH: /app/data/tenman.db
      BACKUP_DIR: /app/backups
      HEARTBEAT_PATH: /app/logs/heartbeat.json
    # Short :Z syntax on purpose: it relabels for SELinux on both engines (the long
    # syntax's bind.selinux isn't applied everywhere, and then SELinux blocks writes).
    volumes:
      - ./data:/app/data:Z
      - ./logs:/app/logs:Z
      - ./backups:/app/backups:Z
      # The token lives in files here, read-only, never in an environment variable.
      # (A plain read-only mount instead of compose `secrets:`: outside Swarm those
      # are bind mounts too, but compose doesn't relabel them for SELinux.)
      - ./secrets:/run/secrets:ro,Z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ipc: private
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    # Bounded container stdout log. k8s-file is set explicitly because max-size
    # is ignored by the journald driver some hosts default to.
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
