name: Feature request
description: An idea for the bot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: How your group organizes games today and where it gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The command, button or alert you have in mind.
